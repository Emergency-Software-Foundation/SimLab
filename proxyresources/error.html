<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporarily Unavailable · eSimLab</title>
  <style>
:root {
  color-scheme: light;
  --sl-primary: #2563eb;
  --sl-primary-hover: #1d4ed8;
  --sl-primary-soft: #eff6ff;
  --sl-ink: #14233f;
  --sl-text: #344563;
  --sl-muted: #64748b;
  --sl-border: #dbe3ee;
  --sl-border-strong: #c5d1e1;
  --sl-surface: #ffffff;
  --sl-canvas: #f6f8fb;
  --sl-subtle: #f1f5f9;
  --sl-success: #15803d;
  --sl-success-bg: #f0fdf4;
  --sl-danger: #b91c1c;
  --sl-danger-bg: #fef2f2;
  --sl-warning: #92400e;
  --sl-warning-bg: #fffbeb;
  --sl-radius-sm: 6px;
  --sl-radius: 10px;
  --sl-radius-lg: 16px;
  --sl-shadow-sm: 0 1px 3px rgb(15 23 42 / 5%);
  --sl-shadow: 0 8px 28px rgb(15 23 42 / 7%);
  --sl-container: 1120px;
  --sl-font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { min-width: 320px; }
body { margin: 0; background: var(--sl-canvas); color: var(--sl-text); font-family: var(--sl-font); font-size: 15px; line-height: 1.55; }
a { color: var(--sl-primary); text-decoration: none; }
a:hover { color: var(--sl-primary-hover); text-decoration: underline; }
button, input, select, textarea { font: inherit; }
button, .btn { cursor: pointer; }
:focus-visible { outline: 3px solid rgb(37 99 235 / 35%); outline-offset: 2px; }
.container { width: min(calc(100% - 40px), var(--sl-container)); margin-inline: auto; }
.container-sm { width: min(calc(100% - 40px), 760px); margin-inline: auto; }
.topbar { height: 72px; background: var(--sl-surface); border-bottom: 1px solid var(--sl-border); }
.topbar-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--sl-ink); font-size: 23px; font-weight: 750; letter-spacing: -.04em; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 34px; height: 34px; display: grid; place-items: center; color: white; background: var(--sl-primary); border-radius: 10px; }
.brand-mark svg { width: 21px; height: 21px; }
.nav-links { display: flex; align-items: center; gap: 22px; }
.nav-link { color: var(--sl-text); font-size: 14px; font-weight: 600; }
.nav-link.primary-link { color: var(--sl-primary); }
main { min-height: calc(100vh - 132px); }
.page-main { padding: 54px 0 70px; }
.page-heading { margin: 0; color: var(--sl-ink); font-size: clamp(28px, 4vw, 38px); line-height: 1.2; letter-spacing: -.04em; font-weight: 750; }
.page-subtitle { max-width: 600px; margin: 12px auto 0; color: var(--sl-muted); font-size: 16px; }
.text-center { text-align: center; }
.eyebrow { color: var(--sl-primary); text-transform: uppercase; letter-spacing: .12em; font-size: 11px; font-weight: 800; }
.card { background: var(--sl-surface); border: 1px solid var(--sl-border); border-radius: var(--sl-radius); box-shadow: var(--sl-shadow-sm); }
.card-body { padding: 28px; }
.join-card { width: min(100%, 560px); margin: 32px auto 0; }
.form-label { display: block; color: var(--sl-text); margin-bottom: 7px; font-size: 14px; font-weight: 700; }
.form-control, .form-select, .form-textarea { display: block; width: 100%; min-height: 46px; padding: 10px 13px; border: 1px solid var(--sl-border-strong); border-radius: var(--sl-radius-sm); background: white; color: var(--sl-ink); transition: border-color .15s, box-shadow .15s; }
.form-control::placeholder, .form-textarea::placeholder { color: #94a3b8; }
.form-control:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--sl-primary); box-shadow: 0 0 0 3px rgb(37 99 235 / 12%); }
.form-textarea { min-height: 100px; resize: vertical; }
.form-hint { margin-top: 6px; color: var(--sl-muted); font-size: 12px; }
.form-group { margin-bottom: 18px; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 43px; padding: 10px 16px; border: 1px solid transparent; border-radius: var(--sl-radius-sm); font-weight: 700; font-size: 14px; line-height: 1.25; text-align: center; transition: background .15s, border-color .15s, color .15s; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { color: white; background: var(--sl-primary); border-color: var(--sl-primary); }
.btn-primary:hover { color: white; background: var(--sl-primary-hover); border-color: var(--sl-primary-hover); text-decoration: none; }
.btn-secondary { color: var(--sl-text); background: white; border-color: var(--sl-border-strong); }
.btn-secondary:hover { background: var(--sl-subtle); text-decoration: none; }
.btn-ghost { color: var(--sl-primary); background: transparent; }
.btn-ghost:hover { background: var(--sl-primary-soft); text-decoration: none; }
.btn-block { width: 100%; }
.btn-sm { min-height: 34px; padding: 7px 11px; font-size: 12px; }
.inline-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.creation-prompt { margin-top: 21px; text-align: center; font-size: 13px; color: var(--sl-muted); }
.footer { min-height: 60px; border-top: 1px solid var(--sl-border); background: var(--sl-surface); }
.footer-inner { min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--sl-muted); font-size: 12px; }
.footer-links { display: flex; gap: 16px; }
.notice { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid; border-radius: var(--sl-radius-sm); font-size: 13px; }
.notice-error { color: var(--sl-danger); border-color: #fecaca; background: var(--sl-danger-bg); }
.notice-success { color: var(--sl-success); border-color: #bbf7d0; background: var(--sl-success-bg); }
.notice-info { color: #1d4ed8; border-color: #bfdbfe; background: var(--sl-primary-soft); }
.hidden { display: none !important; }
.section { margin-top: 34px; }
.section-title { margin: 0 0 14px; color: var(--sl-ink); font-size: 18px; letter-spacing: -.02em; }
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 12px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.muted { color: var(--sl-muted); }
.small { font-size: 12px; }
.badge { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; color: #475569; background: var(--sl-subtle); font-size: 11px; font-weight: 750; }
.badge-blue { color: #1d4ed8; background: var(--sl-primary-soft); }
.divider { height: 1px; border: 0; background: var(--sl-border); margin: 22px 0; }
.step-list { display: flex; gap: 8px; margin: 0 0 28px; padding: 0; list-style: none; }
.step-list li { flex: 1; border-bottom: 3px solid var(--sl-border); padding: 0 0 9px; color: var(--sl-muted); font-size: 12px; font-weight: 700; }
.step-list li.active { color: var(--sl-primary); border-color: var(--sl-primary); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 10px 18px; font-size: 14px; }
.kv dt { color: var(--sl-muted); }
.kv dd { margin: 0; color: var(--sl-ink); font-weight: 650; }
.icon-tile { width: 42px; height: 42px; flex: 0 0 auto; display: grid; place-items: center; color: var(--sl-primary); background: var(--sl-primary-soft); border-radius: 10px; }
.icon-tile svg { width: 21px; height: 21px; }
.choice-card { padding: 20px; }
.choice-card h3 { margin: 12px 0 5px; color: var(--sl-ink); font-size: 16px; }
.choice-card p { margin: 0; color: var(--sl-muted); font-size: 13px; }
.preview-banner { padding: 14px 16px; background: var(--sl-subtle); border-radius: var(--sl-radius-sm); }
.footer-spacer { height: 22px; }
@media (max-width: 720px) {
  .container, .container-sm { width: min(calc(100% - 28px), var(--sl-container)); }
  .topbar { height: 64px; }
  .brand { font-size: 20px; }
  .nav-links { gap: 12px; }
  .nav-link { font-size: 12px; }
  .page-main { padding: 38px 0 48px; }
  .card-body { padding: 21px; }
  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .footer-inner { align-items: flex-start; justify-content: center; flex-direction: column; padding: 14px 0; gap: 8px; }
}
@media (max-width: 440px) {
  .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .nav-links .optional-nav { display: none; }
  .kv { grid-template-columns: 1fr; gap: 3px; }
  .kv dd { margin-bottom: 10px; }
}
.error-card{padding:clamp(26px,5vw,44px);background:var(--sl-surface);border:1px solid var(--sl-border);border-radius:var(--sl-radius);box-shadow:0 8px 28px rgba(16,24,40,.045);text-align:center;margin: 0 25%;}
.error-symbol{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 22px;border-radius:18px;color:red;background:black;font-size:27px;font-weight:750}
.error-code{margin:0 0 8px;color:darkred;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{margin:0;font-size:clamp(25px,4vw,32px);line-height:1.2;letter-spacing:-.035em}
.description{max-width:440px;margin:14px auto 0;color:var(--sl-text);font-size:15px;line-height:1.65}
  </style>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/" aria-label="SimLab home"><span style="background-color:black;" class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="red" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-6.5 11A1.3 1.3 0 0 0 4.6 22h14.8a1.3 1.3 0 0 0 1.1-2L14 9V3"/><path d="M7 17h10M9 14h2"/></svg></span><span>eSimLab</span></a>
  </div>
</header>
<main class="page-main">
  <section class="error-card" aria-labelledby="error-title">
    <div class="error-symbol" aria-hidden="true">!</div>
    <p class="error-code">Error 503</p>
    <h1 id="error-title">eSimLab is temporarily unavailable</h1>
    <p class="description">The service may be restarting or receiving maintenance.<br/>Please wait a moment and try again.</p>
  </section>
</main>
<footer class="footer"><div class="container footer-inner"><span>ESF eSimLab <span aria-hidden="true">·</span> (c) Emergency Software Foundation <span id="copyright-year">2026</span></span> <span style="float:right;"><a href="https://github.com/Emergency-Software-Foundation/SimLab">Contribute</a></span></div></footer>
<script>
  const currentYear = new Date().getFullYear();
  document.getElementById('copyright-year').textContent = currentYear;
</script>
</body></html>
